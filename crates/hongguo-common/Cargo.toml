[package]
name = "hongguo-common"
description = "红果桌面版共用层：领域模型 / 统一错误 / 纯工具 / 跨端常量"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# 领域模型自带默认构造：task 的任务 ID（uuid）、更新时间戳（chrono）、
# settings 的默认下载目录（dirs）——是 model 层的真实依赖，不是工具泄漏。
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "7"
