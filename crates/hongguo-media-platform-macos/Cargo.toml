[package]
name = "hongguo-media-platform-macos"
description = "红果桌面版 macOS 平台原生化：VideoToolbox 硬编/硬解 + AudioToolbox AAC（契约见 hongguo-media-platform-api）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# 统一契约：帧载体 / 解码器 trait / PlatformRequest / bitrate_for。
hongguo-media-platform-api = { path = "../hongguo-media-platform-api" }
# 共用底座：统一错误（AppError / AppResult）。
hongguo-common = { path = "../hongguo-common" }
# 纯 Rust 编解码核心：解复用 / 参数集读取 / 音轨直通 / 封装（转码管线复用）。
hongguo-media = { path = "../hongguo-media" }
# 样本表类型（TrackInfo）：平台硬解要把 hvcC 参数集转 Annex-B 喂解码器。
hongguo-mp4 = { path = "../hongguo-mp4" }
log = "0.4"
parking_lot = "0.12"

# 本 crate 只在 macOS 目标上编译出内容（其余目标为空壳）；平台专属依赖
# 全部进本表，Windows 宿主上连依赖都不构建。
#
# VideoToolbox 是纯 C API，手写声明零依赖（vt/ffi.rs），经
# `#[link(kind = "framework")]` 直接链接系统框架。逐帧解码出口（播放末端）
# 的 CVPixelBuffer 包装类型与 gpui 同源（gpui-pre 的 surface 元素吃这个
# 类型），版本锁定一致避免类型失配。
[target.'cfg(target_os = "macos")'.dependencies]
core-video = { version = "0.5.2", features = ["metal"] }
# TCFType trait（CVPixelBuffer 的引用计数包装用）；与 core-video 自身的
# core-foundation 同大版本，不引入第二份。
core-foundation = "0.10"

[features]
# 门面 test-support 转发：跨 crate 的 e2e 测试通道门控（对齐 hongguo-mp4
# 的 fixtures / hongguo-store 的 ScopedDataDir 先例）。生产构建不带。
test-support = []
