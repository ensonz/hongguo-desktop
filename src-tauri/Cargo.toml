[package]
name = "hongguo-desktop"
description = "红果短剧桌面客户端（Tauri 桌面版）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# 本 crate 是 workspace 成员（根 Cargo.toml 的 members），[patch.crates-io] /
# [profile.*] 都在根 manifest，不在此处。

[lib]
name = "hongguo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 共用底座：领域模型 / 统一错误 / 纯工具 / 跨端常量（自身不依赖 tauri）。
hongguo-common = { path = "../crates/hongguo-common" }
# 请求签名（JS 1:1 移植，禁改写法）；自身不依赖 tauri。
hongguo-signer = { path = "../crates/hongguo-signer" }
# MP4 解析与 CENC 解密；依赖 common，不依赖 tauri。
hongguo-mp4 = { path = "../crates/hongguo-mp4" }
# 官方接口客户端；依赖 common + signer，不依赖 tauri。
hongguo-api = { path = "../crates/hongguo-api" }
# 持久化（Turso 内嵌库）；依赖 common + signer，不依赖 tauri。
hongguo-store = { path = "../crates/hongguo-store" }
# 在线流契约（内存渐进流 + 缓存 + Range 应答）；依赖 common + mp4，不依赖 tauri。
hongguo-stream = { path = "../crates/hongguo-stream" }
# 纯 Rust 编解码（demux / hevc / remux / transcode / 封面 HEIF）；不依赖 tauri。
hongguo-media = { path = "../crates/hongguo-media" }
# 平台层编解码（MF / VT / WIC 硬编 + ffmpeg 执行 + 能力探测）；不依赖 tauri。
hongguo-media-platform = { path = "../crates/hongguo-media-platform" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 单实例锁：两个进程同时写 data.json 会让下载记录随机丢一条。
# 必须是第一个注册的插件（官方要求，锁要抢在窗口创建之前）。
tauri-plugin-single-instance = "2"
# dev 调试通路：在 app 里内嵌 W3C WebDriver 服务器（127.0.0.1:4445），macOS 的
# WKWebView 没有对外 CDP/远程调试协议（桌面目标被 Apple 私有 entitlement 锁给
# Safari），这是官方推荐的等效调试通路。依赖无条件编译——cargo 不支持用
# `debug_assertions` 选依赖（写了直接警告，行为因版本而异）；「只在 dev 暴露」
# 由 lib.rs 里 `#[cfg(debug_assertions)]` 的注册点保证，release 不注册即无端口，
# 未引用的代码随后被 lto+strip 剔除。驱动脚本见 scripts/webdriver.mjs，
# 说明见 docs/webview-cdp-testing.md。
tauri-plugin-webdriver = "0.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "stream",
    "gzip",
] }
futures-util = "0.3"
# zlib-rs 后端：设备注册的 TT-Encrypt V5 要求 gzip 字节流与服务端 zlib
# 逐字节一致，miniz_oxide 的流不同会被静默拒绝
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
bytes = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
rand = "0.10"
base64 = "0.23"
hex = "0.4"
urlencoding = "2"
md-5 = "0.11"
sha2 = "0.11"
sm3 = "0.5"
aes = "0.9"
ctr = "0.10"
cbc = { version = "0.2", features = ["alloc"] }
digest = "0.11"
time = { version = "0.3", features = ["formatting", "macros"] }
percent-encoding = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
# 编解码相关的重型依赖随两个媒体 crate 迁走了：rusty_h265 / rusty_h264 /
# muxide / sysinfo / jpeg-encoder 在 crates/hongguo-media 与封面软解级，
# windows（MF/WIC 的 COM 绑定）在 crates/hongguo-media-platform。
mouse_position = "0.1"
tauri-plugin-updater = "2.13.2"
tauri-plugin-process = "2.4.0"

# macOS 原生红绿灯的藏/显（小屏模式）：直接对三颗 NSWindowButton setHidden，
# 而不是 set_decorations 切 borderless——tao 的 set_decorations 是**整体替换
# styleMask**，会把 Overlay 全出血依赖的 FullSizeContentView 位抹掉（标题条
# 重新占位 28px、内容被顶下去，外框实测 840→868）。objc2 / objc2-app-kit 已
# 在 tao 的依赖树里，同版本声明为直接依赖不新增外部 crate——与上面复用
# windows crate 是同一思路。实现见 app_cmd 的 set_traffic_lights_hidden。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSButton",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
# 本 crate 的测试要构造 MP4 样本，开启 hongguo-mp4 的测试辅助模块（fixtures /
# streaming_tests）；生产构建不带该 feature。
hongguo-mp4 = { path = "../crates/hongguo-mp4", features = ["test-support"] }
# 本 crate 的落盘用例要把数据目录重定向到临时目录（不能写进用户真实
# %APPDATA%），开启 hongguo-store 的测试辅助件（`paths::ScopedDataDir`）。
hongguo-store = { path = "../crates/hongguo-store", features = ["test-support"] }
# 跨层 e2e（src/testing/media_pipeline_e2e.rs）要调 hongguo-media-platform 的
# 测试通道（`platform::transcode_h264_for_tests`），开启其 test-support。
hongguo-media-platform = { path = "../crates/hongguo-media-platform", features = ["test-support"] }
