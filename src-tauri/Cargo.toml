[package]
name = "hongguo-desktop"
description = "红果短剧桌面客户端（Tauri 桌面版）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# 本 crate 是 workspace 成员（根 Cargo.toml 的 members），[patch.crates-io] /
# [profile.*] 都在根 manifest，不在此处。

[lib]
name = "hongguo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 共用底座：领域模型 / 统一错误 / 纯工具 / 跨端常量（自身不依赖 tauri）。
hongguo-common = { path = "../crates/hongguo-common" }
# 请求签名（JS 1:1 移植，禁改写法）；自身不依赖 tauri。
hongguo-signer = { path = "../crates/hongguo-signer" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 单实例锁：两个进程同时写 data.json 会让下载记录随机丢一条。
# 必须是第一个注册的插件（官方要求，锁要抢在窗口创建之前）。
tauri-plugin-single-instance = "2"
# dev 调试通路：在 app 里内嵌 W3C WebDriver 服务器（127.0.0.1:4445），macOS 的
# WKWebView 没有对外 CDP/远程调试协议（桌面目标被 Apple 私有 entitlement 锁给
# Safari），这是官方推荐的等效调试通路。依赖无条件编译——cargo 不支持用
# `debug_assertions` 选依赖（写了直接警告，行为因版本而异）；「只在 dev 暴露」
# 由 lib.rs 里 `#[cfg(debug_assertions)]` 的注册点保证，release 不注册即无端口，
# 未引用的代码随后被 lto+strip 剔除。驱动脚本见 scripts/webdriver.mjs，
# 说明见 docs/webview-cdp-testing.md。
tauri-plugin-webdriver = "0.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "stream",
    "gzip",
] }
futures-util = "0.3"
# zlib-rs 后端：设备注册的 TT-Encrypt V5 要求 gzip 字节流与服务端 zlib
# 逐字节一致，miniz_oxide 的流不同会被静默拒绝
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
bytes = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
rand = "0.10"
base64 = "0.23"
hex = "0.4"
urlencoding = "2"
md-5 = "0.11"
sha2 = "0.11"
sm3 = "0.5"
aes = "0.9"
ctr = "0.10"
cbc = { version = "0.2", features = ["alloc"] }
digest = "0.11"
time = { version = "0.3", features = ["formatting", "macros"] }
percent-encoding = "2"
chrono = "0.4"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
rusty_h265 = "0.6.0"
rusty_h264 = "0.16.0"
muxide = "0.2.5"
# 合并前校验要问「输出卷还剩多少字节」。只开 disk：默认 feature 会把
# component / network / system / user 一并拖进来，本项目一个都用不上。
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
turso = { version = "0.8.1", default-features = false }
mouse_position = "0.1"
tauri-plugin-updater = "2.13.2"
tauri-plugin-process = "2.4.0"

# 封面纯软解级的 JPEG 编码（media/heif）：纯 Rust、零 unsafe，RGB 直入。
# 只需要「一帧 → JPEG」这一步，不引 image 全家桶。**跨平台主依赖**——
# heif.rs 无条件编译，放进 target 专属表会在另一侧直接缺 crate（03029e8
# 曾误挂 windows 表导致 macOS dev 构建失败）。
jpeg-encoder = "0.6"

# 平台硬编走 `media::platform`（macOS VideoToolbox / Windows Media Foundation）。
# FFI 路线按 API 性质分：VideoToolbox 是纯 C API，手写声明零依赖（vt/ffi.rs）；
# Media Foundation 是 COM（虚表调用），手排虚表槽位错一个就是运行期崩——
# 用 windows crate 的生成绑定（见下方 target 专属依赖，不新增外部 crate）。
# ffmpeg 外部进程是平台硬编不可用时的中间回退，音轨一律不解码（AAC 直通）。
# 验证策略：Apple Silicon 的 macOS CI 真跑 VideoToolbox 端到端；Windows 侧
# 本机真机验收（GTX 1650：NVENC MFT + HEVC 扩展解码全链路 e2e 绿），CI 验
# 纯逻辑层；软解路径（rusty_h265/rusty_h264）永远兜底，产物一律过可播校验闸。

# Windows 平台硬编（Media Foundation）的 COM 绑定。选 windows crate 而不是
# 手写虚表：MF 是 COM API（接口经虚表调用），与 macOS VideoToolbox 的纯 C
# API 不同——手排虚表槽位错一个就是运行期崩到错误函数上。0.62 已在依赖图里
# （tauri/wry/sysinfo 传递引入），声明为直接依赖不新增外部 crate，feature
# 按需裁剪只编译用到的接口。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    # WIC 静图解码：封面的平台级通路（HEIF/HEVC 扩展在则走系统解码器）
    "Win32_Graphics_Imaging",
    # 内存流：HEIC 字节 → IStream → WIC 解码器
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
] }

# macOS 原生红绿灯的藏/显（小屏模式）：直接对三颗 NSWindowButton setHidden，
# 而不是 set_decorations 切 borderless——tao 的 set_decorations 是**整体替换
# styleMask**，会把 Overlay 全出血依赖的 FullSizeContentView 位抹掉（标题条
# 重新占位 28px、内容被顶下去，外框实测 840→868）。objc2 / objc2-app-kit 已
# 在 tao 的依赖树里，同版本声明为直接依赖不新增外部 crate——与上面复用
# windows crate 是同一思路。实现见 app_cmd 的 set_traffic_lights_hidden。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSButton",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
