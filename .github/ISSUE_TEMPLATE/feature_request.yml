name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法。提交前请先搜索现有 issue，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的痛点或使用场景，而不是直接描述解决方案
      placeholder: 例：追剧时想记住看到第几集，每次都要手动翻播放记录。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的效果
      description: 你希望这个功能做成什么样
      placeholder: 例：在播放页显示「上次看到第 3 集 12:30」，点击可续播。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
      description: 有没有其他曲线救国的方式？为什么不够好？

  - type: textarea
    id: context
    attributes:
      label: 补充上下文（可选）
      description: 截图、其他 App 的类似实现等
